# No GPU:  docker compose -f docker/compose.yml --profile lite up   -> http://localhost:8000 (oracle fixture)
# GPU:     docker compose -f docker/compose.yml --profile gpu up    -> model server on :8100 + app on :8000
services:
  app-lite:
    profiles: [lite]
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["app", "--host", "0.0.0.0", "--model", "oracle", "--no-browser"]
    ports: ["8000:8000"]
  model:
    profiles: [gpu]
    build: { context: .., dockerfile: docker/Dockerfile, args: { MODEL: edge } }
    command: ["serve-model", "--model", "edge", "--port", "8100"]
    environment: [HF_TOKEN]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    ports: ["8100:8100"]
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
  app:
    profiles: [gpu]
    build: { context: .., dockerfile: docker/Dockerfile }
    command: ["app", "--host", "0.0.0.0", "--model", "edge", "--runtime", "remote", "--remote-url", "http://model:8100", "--no-browser"]
    ports: ["8000:8000"]
    depends_on: [model]
volumes:
  hf-cache:
